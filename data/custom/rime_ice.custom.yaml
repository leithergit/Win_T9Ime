# T9Ime patch for rime-ice rime_ice (全拼, physical keyboard).
# Removes the radical_pinyin (部件拆字) reverse lookup to save ~1.4 MB compressed.
# All other lua components are kept.
patch:
  schema/dependencies:
    - melt_eng
  engine/segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  engine/translators:
    - punct_translator
    - script_translator
    - lua_translator@*date_translator
    - lua_translator@*lunar
    - lua_translator@*uuid
    - table_translator@custom_phrase
    - table_translator@melt_eng
    - table_translator@cn_en
    - lua_translator@*unicode
    - lua_translator@*number_translator
    - lua_translator@*calc_translator
    - lua_translator@*force_gc
  engine/filters:
    - lua_filter@*corrector
    - lua_filter@*autocap_filter
    - lua_filter@*v_filter
    - lua_filter@*pin_cand_filter
    - lua_filter@*long_word_filter
    - lua_filter@*reduce_english_filter
    - simplifier@emoji
    - simplifier@traditionalize
    - uniquifier
  recognizer/patterns/radical_lookup: ""
